<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>banijay Hero Animation</title>
  <style>
    :root {
      --bg: #050407;
      --ink: #f8f3f6;
      --muted: rgba(248, 243, 246, .58);
      --pink: #f05d7d;
      --pink-hot: #ff79a1;
      --blue: #6d7dff;
      --amber: #e7a187;
      --panel: rgba(9, 7, 13, .58);
      --line: rgba(255, 255, 255, .14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 420svh;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100svh;
      display: block;
      z-index: 2;
      background: transparent;
      filter:
        saturate(1.22)
        contrast(1.05)
        drop-shadow(0 0 4px rgba(255, 245, 255, .38))
        drop-shadow(0 0 9px rgba(255, 44, 172, .58))
        drop-shadow(0 0 8px rgba(116, 232, 255, .46))
        drop-shadow(0 0 16px rgba(70, 210, 255, .32))
        drop-shadow(0 0 30px rgba(70, 210, 255, .18));
    }

    .visual-bg {
      --space-x: 0vw;
      --space-y: 0vh;
      --space-scale: 1.02;
      position: fixed;
      inset: -7vh -7vw;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: #050407;
    }

    .visual-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("assets/background-neon-stage.png");
      background-image: image-set(
        url("assets/background-neon-stage.webp") type("image/webp"),
        url("assets/background-neon-stage.png") type("image/png")
      );
      background-size: cover;
      background-position: 50% 50%;
      opacity: 1;
      filter: none;
      mix-blend-mode: normal;
      transform: translate3d(var(--space-x), var(--space-y), 0) scale(var(--space-scale));
      transform-origin: 50% 58%;
      will-change: transform;
    }

    .visual-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      display: none;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
    }

    .hud {
      position: fixed;
      z-index: 4;
      left: clamp(18px, 3vw, 42px);
      right: clamp(18px, 3vw, 42px);
      top: clamp(18px, 3vw, 38px);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    .brand {
      position: absolute;
      left: 50%;
      top: 0;
      max-width: min(780px, 72vw);
      text-align: center;
      transform: translateX(-50%);
    }

    h1 {
      --headline-glow: 1;
      margin: 0;
      max-width: 760px;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(58px, 10vw, 172px);
      line-height: .82;
      letter-spacing: 0;
      color: #fff;
      text-transform: uppercase;
      font-weight: 900;
      text-wrap: balance;
      text-shadow:
        0 0 5px rgb(255 255 255 / calc(.58 * var(--headline-glow))),
        0 0 18px rgb(255 255 255 / calc(.36 * var(--headline-glow))),
        0 0 30px rgb(255 44 211 / calc(.48 * var(--headline-glow))),
        0 0 58px rgb(130 55 255 / calc(.36 * var(--headline-glow))),
        0 14px 54px rgba(0, 0, 0, .52);
      opacity: 0;
      transform: translateY(26px) scale(.985);
      filter: blur(10px);
      animation:
        heroTitleIn 1.45s cubic-bezier(.16, 1, .3, 1) .18s forwards,
        titleGlimmer 4.8s ease-in-out 1.65s infinite;
    }

    h1 span {
      display: block;
    }

    .h1-kicker {
      font-size: .68em;
      line-height: .78;
      font-style: normal;
      transform: none;
      transform-origin: center;
    }

    .corner-logo {
      width: clamp(36px, 4.4vw, 64px);
      height: auto;
      color: #fff;
      filter:
        drop-shadow(0 0 18px rgba(255, 255, 255, .34))
        drop-shadow(0 0 32px rgba(255, 44, 172, .22));
      opacity: 0;
      transform: translateY(-8px);
      animation: logoIn 1.1s ease .55s forwards;
    }

    .media-gallery {
      --gallery-x: 0vw;
      --gallery-y: 0vh;
      --gallery-tilt: 0deg;
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      perspective: 980px;
      perspective-origin: 50% 48%;
      opacity: 0;
      transform: translate3d(0, 22px, 0) scale(.985);
      transform-origin: 50% 50%;
      will-change: opacity, transform;
    }

    .gallery-space {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform: translate3d(var(--gallery-x), var(--gallery-y), 0) rotateX(var(--gallery-tilt));
      will-change: transform;
    }

    .video-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(190px, 22vw, 390px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: rgba(4, 4, 8, .72);
      box-shadow:
        0 0 0 1px rgba(111, 220, 255, .06) inset,
        0 0 22px rgba(78, 192, 255, .16),
        0 18px 70px rgba(0, 0, 0, .58);
      transform-style: preserve-3d;
      filter: saturate(1.08) contrast(1.08);
    }

    .video-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .12), transparent 18%, transparent 76%, rgba(0, 0, 0, .34)),
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .18), transparent 38%);
      mix-blend-mode: screen;
      opacity: .55;
    }

    .video-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transform: scale(1.08);
    }

    .video-card picture {
      display: block;
      width: 100%;
      height: 100%;
    }

    .card-a { transform: translate3d(-61vw, -31vh, -300px) rotateY(34deg) rotateZ(-2deg); }
    .card-b { transform: translate3d(-38vw, -10vh, -180px) rotateY(24deg) rotateZ(1deg); }
    .card-c { transform: translate3d(-57vw, 19vh, -250px) rotateY(31deg) rotateZ(2deg); }
    .card-d { transform: translate3d(-29vw, 30vh, -90px) rotateY(18deg) rotateZ(-1deg); }
    .card-e { transform: translate3d(61vw, -31vh, -300px) rotateY(-34deg) rotateZ(2deg); }
    .card-f { transform: translate3d(38vw, -10vh, -180px) rotateY(-24deg) rotateZ(-1deg); }
    .card-g { transform: translate3d(57vw, 19vh, -250px) rotateY(-31deg) rotateZ(-2deg); }
    .card-h { transform: translate3d(29vw, 30vh, -90px) rotateY(-18deg) rotateZ(1deg); }

    .progress {
      position: fixed;
      z-index: 4;
      left: 0;
      top: 0;
      width: 100%;
      height: 2px;
      transform-origin: left;
      transform: scaleX(0);
      background: linear-gradient(90deg, var(--blue), var(--pink), var(--amber));
      box-shadow: 0 0 20px rgba(240, 93, 125, .7);
    }

    @keyframes heroTitleIn {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(.985);
        filter: blur(12px);
      }
      52% {
        opacity: 1;
        filter: blur(1.5px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes logoIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes titleGlimmer {
      0%, 100% {
        text-shadow:
          0 0 5px rgb(255 255 255 / calc(.54 * var(--headline-glow))),
          0 0 18px rgb(255 255 255 / calc(.32 * var(--headline-glow))),
          0 0 28px rgb(255 44 211 / calc(.42 * var(--headline-glow))),
          0 0 54px rgb(130 55 255 / calc(.30 * var(--headline-glow))),
          0 14px 54px rgba(0, 0, 0, .52);
      }
      48% {
        text-shadow:
          0 0 7px rgb(255 255 255 / calc(.72 * var(--headline-glow))),
          0 0 24px rgb(255 255 255 / calc(.42 * var(--headline-glow))),
          0 0 42px rgb(255 44 211 / calc(.60 * var(--headline-glow))),
          0 0 76px rgb(130 55 255 / calc(.48 * var(--headline-glow))),
          0 14px 54px rgba(0, 0, 0, .52);
      }
    }

    svg#source-mark { position: absolute; width: 0; height: 0; overflow: hidden; }

    @media (max-width: 760px) {
      .hud {
        align-items: flex-start;
        gap: 16px;
      }

      .brand {
        left: 18px;
        max-width: calc(100vw - 112px);
        text-align: left;
        transform: none;
      }

      h1 {
        font-size: clamp(46px, 16vw, 82px);
      }

      .media-gallery {
        opacity: 0 !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body { min-height: 100svh; }
      h1,
      .corner-logo {
        opacity: 1;
        transform: none;
        filter: none;
        animation: none;
      }
      .media-gallery {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="visual-bg" aria-hidden="true"></div>
  <div class="media-gallery" id="mediaGallery" aria-hidden="true">
    <div class="gallery-space">
      <figure class="video-card card-a"><picture><source srcset="assets/video-snippets/panel-01.webp" type="image/webp"><img src="assets/video-snippets/panel-01.gif" alt=""></picture></figure>
      <figure class="video-card card-b"><picture><source srcset="assets/video-snippets/panel-02.webp" type="image/webp"><img src="assets/video-snippets/panel-02.gif" alt=""></picture></figure>
      <figure class="video-card card-c"><picture><source srcset="assets/video-snippets/panel-03.webp" type="image/webp"><img src="assets/video-snippets/panel-03.gif" alt=""></picture></figure>
      <figure class="video-card card-d"><picture><source srcset="assets/video-snippets/panel-04.webp" type="image/webp"><img src="assets/video-snippets/panel-04.gif" alt=""></picture></figure>
      <figure class="video-card card-e"><picture><source srcset="assets/video-snippets/panel-05.webp" type="image/webp"><img src="assets/video-snippets/panel-05.gif" alt=""></picture></figure>
      <figure class="video-card card-f"><picture><source srcset="assets/video-snippets/panel-06.webp" type="image/webp"><img src="assets/video-snippets/panel-06.gif" alt=""></picture></figure>
      <figure class="video-card card-g"><picture><source srcset="assets/video-snippets/panel-07.webp" type="image/webp"><img src="assets/video-snippets/panel-07.gif" alt=""></picture></figure>
      <figure class="video-card card-h"><picture><source srcset="assets/video-snippets/panel-08.webp" type="image/webp"><img src="assets/video-snippets/panel-08.gif" alt=""></picture></figure>
    </div>
  </div>
  <canvas id="stage" aria-label="banijay wireflow animation"></canvas>
  <div class="grain"></div>

  <header class="hud">
    <div class="brand">
      <h1><span class="h1-kicker">We are</span><span>banijay</span></h1>
    </div>
    <svg class="corner-logo" viewBox="0 0 52.5 53.72" aria-label="banijay B">
      <path fill="currentColor" d="M39.62,25.77H0V1.65C0,.74.74,0,1.65,0h37.97c7.12,0,12.89,5.77,12.89,12.89h0c0,8.9-5.77,12.89-12.89,12.89Z"/>
      <path fill="currentColor" d="M39.62,27.94H0v24.13c0,.91.74,1.65,1.65,1.65h37.97c7.12,0,12.89-5.77,12.89-12.89h0c0-8.9-5.77-12.89-12.89-12.89Z"/>
    </svg>
  </header>

  <svg id="source-mark" viewBox="0 0 52.5 53.72" aria-hidden="true">
    <path id="b-top" d="M39.62,25.77H0V1.65C0,.74.74,0,1.65,0h37.97c7.12,0,12.89,5.77,12.89,12.89h0c0,8.9-5.77,12.89-12.89,12.89Z"/>
    <path id="b-bottom" d="M39.62,27.94H0v24.13c0,.91.74,1.65,1.65,1.65h37.97c7.12,0,12.89-5.77,12.89-12.89h0c0-8.9-5.77-12.89-12.89-12.89Z"/>
  </svg>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

    const canvas = document.getElementById("stage");
    const progressEl = document.getElementById("progress");
    const visualBg = document.querySelector(".visual-bg");
    const mediaGallery = document.getElementById("mediaGallery");
    const hud = document.querySelector(".hud");
    const heroTitle = document.querySelector("h1");
    let smoothScroll = 0;
    let lastFrameTime = performance.now();

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.35));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 2600);
    camera.position.set(0, 0, 880);

    const root = new THREE.Group();
    scene.add(root);

    const pink = new THREE.Color("#ff2f9b");
    const hot = new THREE.Color("#ff4fc3");
    const blue = new THREE.Color("#74e8ff");
    const amber = new THREE.Color("#ff7bd6");
    const white = new THREE.Color("#fff5ff");

    const wireMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.78,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const faintWireMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.18,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const flowMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.66,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const wireGeo = new THREE.BufferGeometry();
    const wire = new THREE.LineSegments(wireGeo, wireMat);
    wire.frustumCulled = false;
    root.add(wire);

    const faintGeo = new THREE.BufferGeometry();
    const faint = new THREE.LineSegments(faintGeo, faintWireMat);
    faint.frustumCulled = false;
    root.add(faint);

    const flowGeo = new THREE.BufferGeometry();
    const flow = new THREE.LineSegments(flowGeo, flowMat);
    flow.frustumCulled = false;
    root.add(flow);

    const flowGlowMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.34,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const flowGlowGeo = new THREE.BufferGeometry();
    const flowGlow = new THREE.LineSegments(flowGlowGeo, flowGlowMat);
    flowGlow.frustumCulled = false;
    root.add(flowGlow);

    const haloMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const haloGeo = new THREE.BufferGeometry();
    const halo = new THREE.LineSegments(haloGeo, haloMat);
    halo.frustumCulled = false;
    root.add(halo);

    function makeGlowTexture() {
      const c = document.createElement("canvas");
      c.width = c.height = 96;
      const ctx = c.getContext("2d");
      const g = ctx.createRadialGradient(48, 48, 0, 48, 48, 48);
      g.addColorStop(0, "rgba(255,255,255,1)");
      g.addColorStop(.24, "rgba(255,255,255,.82)");
      g.addColorStop(.48, "rgba(255,160,190,.32)");
      g.addColorStop(1, "rgba(255,160,190,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 96, 96);
      return new THREE.CanvasTexture(c);
    }

    const glowTexture = makeGlowTexture();
    const nodeGeo = new THREE.BufferGeometry();
    const nodeMat = new THREE.PointsMaterial({
      size: 3.6,
      color: 0xffffff,
      map: glowTexture,
      transparent: true,
      opacity: 0.56,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const nodes = new THREE.Points(nodeGeo, nodeMat);
    nodes.frustumCulled = false;
    root.add(nodes);

    const glowGeo = new THREE.BufferGeometry();
    const glowMat = new THREE.PointsMaterial({
      size: 380,
      color: 0xff2f9b,
      map: glowTexture,
      transparent: true,
      opacity: 0,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const glows = new THREE.Points(glowGeo, glowMat);
    glows.frustumCulled = false;
    root.add(glows);

    const tmp = new THREE.Vector3();
    const tmpA = new THREE.Vector3();
    const tmpB = new THREE.Vector3();
    const tmpColorA = new THREE.Color();
    const tmpColorB = new THREE.Color();
    const scratchPos = [];
    const scratchCol = [];
    const fPos = [];
    const fCol = [];
    const nPos = [];
    const gPos = [];
    const targetPoints = [];
    const wirePairs = [];
    const faintPairs = [];
    const haloPairs = [];
    const trunks = [];
    const flows = [];
    const rng = mulberry32(210726);

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function logoPoint(x, y, z) {
      return new THREE.Vector3((x - 26.25) * 8.2, (26.86 - y) * 8.2, z);
    }

    function insertSharpPoint(points, point) {
      let bestIndex = 0;
      let bestDistance = Infinity;
      for (let i = 0; i < points.length; i++) {
        const a = points[i];
        const b = points[(i + 1) % points.length];
        const ab = b.clone().sub(a);
        const t = clamp(point.clone().sub(a).dot(ab) / Math.max(ab.lengthSq(), .0001));
        const projected = a.clone().add(ab.multiplyScalar(t));
        const distance = projected.distanceTo(point);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = i + 1;
        }
      }
      points.splice(bestIndex, 0, point);
      return points;
    }

    function samplePath(id, count, z, sharpPoints = []) {
      const path = document.getElementById(id);
      const len = path.getTotalLength();
      const out = [];
      for (let i = 0; i < count; i++) {
        const p = path.getPointAtLength((i / count) * len);
        out.push(logoPoint(p.x, p.y, z));
      }
      sharpPoints.forEach(([x, y]) => insertSharpPoint(out, logoPoint(x, y, z)));
      return out;
    }

    const frontTop = samplePath("b-top", 112, 54, [[0, 25.77]]);
    const frontBottom = samplePath("b-bottom", 112, 54, [[0, 27.94]]);
    const backTop = samplePath("b-top", 112, -170, [[0, 25.77]]).map(p => p.add(new THREE.Vector3(-92, 46, 0)));
    const backBottom = samplePath("b-bottom", 112, -170, [[0, 27.94]]).map(p => p.add(new THREE.Vector3(-92, 46, 0)));

    makeOutline(frontTop, hot, wirePairs);
    makeOutline(frontBottom, hot, wirePairs);
    makeOutline(backTop, blue, faintPairs);
    makeOutline(backBottom, blue, faintPairs);
    makeHalo(frontTop, hot, haloPairs);
    makeHalo(frontBottom, hot, haloPairs);
    makeHalo(backTop, blue, haloPairs);
    makeHalo(backBottom, blue, haloPairs);

    [...frontTop, ...frontBottom].forEach((p, i) => {
      if (i % 4 === 0) targetPoints.push({ p, c: i < frontTop.length ? hot : amber });
    });
    [...backTop, ...backBottom].forEach((p, i) => {
      if (i % 12 === 0) targetPoints.push({ p, c: blue });
    });

    const leftHub = new THREE.Vector3(-250, 8, 78);
    const rightHub = new THREE.Vector3(258, 10, 12);
    const leftSource = new THREE.Vector3(-1500, -72, 34);
    const rightSource = new THREE.Vector3(1120, 38, -22);
    const leftTargets = targetPoints.filter(({ p }) => p.x < 22).sort((a, b) => b.p.y - a.p.y).slice(0, 34);
    const rightTargets = targetPoints.filter(({ p }) => p.x >= 22).sort((a, b) => b.p.y - a.p.y).slice(0, 34);
    makeTrunk("left", leftSource, leftHub, blue, hot);
    makeTrunk("right", rightSource, rightHub, amber, hot);
    makeFlowFan("left", leftHub, leftTargets, blue, hot);
    makeFlowFan("right", rightHub, rightTargets, amber, hot);

    function makeOutline(points, color, bucket) {
      for (let i = 0; i < points.length; i++) {
        bucket.push({ a: points[i], b: points[(i + 1) % points.length], ca: color, cb: color });
      }
    }

    function makeHalo(points, color, bucket) {
      const offsets = [
        new THREE.Vector3(0, 0, 0)
      ];
      offsets.forEach((offset, copy) => {
        for (let i = 0; i < points.length; i++) {
          const a = points[i].clone().add(offset);
          const b = points[(i + 1) % points.length].clone().add(offset);
          const mix = copy === 0 ? .18 : .38;
          bucket.push({ a, b, ca: color.clone().lerp(white, mix), cb: color.clone().lerp(white, mix) });
        }
      });
    }

    function addCurveSegments(bucket, a, mid, b, segments, ca, cb) {
      let prev = a.clone();
      for (let i = 1; i <= segments; i++) {
        const t0 = (i - 1) / segments;
        const t1 = i / segments;
        const start = i === 1 ? prev : bezier(a, mid, b, t0, new THREE.Vector3());
        const end = bezier(a, mid, b, t1, new THREE.Vector3());
        bucket.push({ a: start, b: end, ca: ca.clone().lerp(cb, t0), cb: ca.clone().lerp(cb, t1) });
      }
    }

    function makeTrunk(side, source, hub, c0, c1) {
      trunks.push({
        side,
        source: source.clone(),
        hub: hub.clone(),
        bend: new THREE.Vector3(
          lerp(source.x, hub.x, .55),
          lerp(source.y, hub.y, .55),
          hub.z + (side === "left" ? 148 : 118)
        ),
        c0: c0.clone(),
        c1: c1.clone()
      });
    }

    function makeFlowFan(side, hub, targets, c0, c1) {
      targets.forEach((target, i) => {
        const t = target.p.clone();
        const u = targets.length > 1 ? i / (targets.length - 1) : 0;
        const branchBend = hub.clone().lerp(t, .48);
        branchBend.y += Math.sin(u * Math.PI) * (side === "left" ? 30 : -26);
        branchBend.z += 96;
        flows.push({
          side,
          hub: hub.clone(),
          branchBend,
          end: t,
          c0: c0.clone(),
          c1: target.c.clone().lerp(c1, .45),
          delay: u * .10,
          speed: .74,
          index: i,
          count: targets.length
        });
      });
    }

    function bezier(a, b, c, t, out) {
      const mt = 1 - t;
      out.set(
        mt * mt * a.x + 2 * mt * t * b.x + t * t * c.x,
        mt * mt * a.y + 2 * mt * t * b.y + t * t * c.y,
        mt * mt * a.z + 2 * mt * t * b.z + t * t * c.z
      );
      return out;
    }

    function ease(t) { return t * t * (3 - 2 * t); }
    function smoother(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function outExpo(t) { return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); }
    function clamp(v, a = 0, b = 1) { return Math.max(a, Math.min(b, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    function pushLineSample(pos, col, a, b, ca, cb, offset) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len * offset;
      const ny = dx / len * offset;
      pos.push(
        a.x + nx, a.y + ny, a.z,
        b.x + nx, b.y + ny, b.z
      );
      col.push(ca.r, ca.g, ca.b, cb.r, cb.g, cb.b);
    }

    function pushLine(pos, col, a, b, ca, cb) {
      pushLineSample(pos, col, a, b, ca, cb, 0);
      pushLineSample(pos, col, a, b, ca, cb, .82);
      pushLineSample(pos, col, a, b, ca, cb, -.82);
    }

    function setLineSegments(geo, pairs, reveal = 1) {
      scratchPos.length = 0;
      scratchCol.length = 0;
      for (let i = 0; i < pairs.length; i++) {
        const pair = pairs[i];
        const local = clamp(reveal * 1.16 - i / pairs.length * .16);
        if (local <= 0) continue;
        tmp.copy(pair.a).lerp(pair.b, outExpo(local));
        pushLine(scratchPos, scratchCol, pair.a, tmp, pair.ca, pair.cb);
      }
      geo.setAttribute("position", new THREE.Float32BufferAttribute(scratchPos, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(scratchCol, 3));
    }

    function update() {
      const now = performance.now();
      const dt = Math.min(.08, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      const targetScroll = clamp(scrollY / maxScroll);
      smoothScroll += (targetScroll - smoothScroll) * (1 - Math.exp(-dt * 4.2));
      const s = smoothScroll;
      progressEl.style.transform = `scaleX(${s})`;
      hud.style.opacity = 1;
      heroTitle.style.setProperty("--headline-glow", (1 - smoother(clamp((s - .62) / .34))).toFixed(3));

      const trunkReveal = smoother(clamp((s - .035) / .32));
      const fanReveal = smoother(clamp((s - .30) / .34));
      const wireReveal = smoother(clamp((s - .42) / .30));
      const lock = smoother(clamp((s - .58) / .28));
      const galleryReveal = smoother(clamp((s - .66) / .26));
      const spaceShift = smoother(clamp((s - .06) / .88));
      const breathing = performance.now() * .001;

      visualBg.style.setProperty("--space-x", `${lerp(-1.4, 2.8, spaceShift).toFixed(3)}vw`);
      visualBg.style.setProperty("--space-y", `${lerp(.8, -1.8, spaceShift).toFixed(3)}vh`);
      visualBg.style.setProperty("--space-scale", lerp(1.035, 1.085, spaceShift).toFixed(4));
      mediaGallery.style.opacity = (galleryReveal * .88).toFixed(3);
      mediaGallery.style.transform = `translate3d(0, ${lerp(28, 0, galleryReveal).toFixed(2)}px, 0) scale(${lerp(.982, 1, galleryReveal).toFixed(4)})`;
      mediaGallery.style.setProperty("--gallery-x", `${lerp(1.6, -1.8, spaceShift).toFixed(3)}vw`);
      mediaGallery.style.setProperty("--gallery-y", `${lerp(.8, -1.4, galleryReveal).toFixed(3)}vh`);
      mediaGallery.style.setProperty("--gallery-tilt", `${lerp(2.4, 0, galleryReveal).toFixed(3)}deg`);

      camera.position.x = lerp(-18, 28, spaceShift) + Math.sin(breathing * .32) * 3.5;
      camera.position.y = lerp(0, -16, spaceShift) + Math.sin(breathing * .26) * 2.2;
      camera.fov = lerp(42, 38.5, spaceShift);
      camera.lookAt(lerp(0, 24, spaceShift), lerp(0, -10, spaceShift), 0);
      camera.updateProjectionMatrix();

      root.rotation.x = THREE.MathUtils.degToRad(lerp(0, -12, lock) + Math.sin(breathing * .4) * .7);
      root.rotation.y = THREE.MathUtils.degToRad(lerp(-18, -44, lock) + Math.sin(breathing * .35) * .9);
      root.rotation.z = THREE.MathUtils.degToRad(lerp(0, -3, lock));
      root.position.y = lerp(30, -4, lock);
      root.scale.setScalar(lerp(.72, .84, lock));

      setLineSegments(wireGeo, wirePairs, wireReveal);
      setLineSegments(faintGeo, faintPairs, wireReveal);
      setLineSegments(haloGeo, haloPairs, wireReveal);

      fPos.length = 0;
      fCol.length = 0;
      nPos.length = 0;
      gPos.length = 0;
      const flowSegments = 54;
      const trunkSegments = 72;

      for (const trunk of trunks) {
        const trunkEnd = outExpo(trunkReveal);
        const trunkSegs = Math.max(1, Math.ceil(trunkSegments * trunkEnd));
        for (let j = 1; j <= trunkSegs; j++) {
          const t0 = (j - 1) / trunkSegments;
          const t1 = j / trunkSegments;
          if (t0 > trunkEnd) break;
          const tt1 = Math.min(t1, trunkEnd);
          bezier(trunk.source, trunk.bend, trunk.hub, t0, tmpA);
          bezier(trunk.source, trunk.bend, trunk.hub, tt1, tmpB);
          tmpColorA.copy(trunk.c0).lerp(white, t0 * .22);
          tmpColorB.copy(trunk.c0).lerp(trunk.c1, tt1 * .36);
          pushLine(fPos, fCol, tmpA, tmpB, tmpColorA, tmpColorB);
        }
      }

      for (let i = 0; i < flows.length; i++) {
        const f = flows[i];
        const local = clamp((fanReveal - f.delay) / f.speed);
        if (local <= 0) continue;
        const draw = outExpo(local);
        const hub = f.hub;
        const branchSegs = Math.max(1, Math.ceil(flowSegments * draw));
        for (let j = 1; j <= branchSegs; j++) {
          const t0 = (j - 1) / flowSegments;
          const t1 = j / flowSegments;
          if (t0 > draw) break;
          const tt1 = Math.min(t1, draw);
          bezier(hub, f.branchBend, f.end, t0, tmpA);
          bezier(hub, f.branchBend, f.end, tt1, tmpB);
          tmpColorA.copy(f.c0).lerp(f.c1, .35 + t0 * .65);
          tmpColorB.copy(f.c0).lerp(f.c1, .35 + tt1 * .65);
          pushLine(fPos, fCol, tmpA, tmpB, tmpColorA, tmpColorB);
        }
      }

      flowGeo.setAttribute("position", new THREE.Float32BufferAttribute(fPos, 3));
      flowGeo.setAttribute("color", new THREE.Float32BufferAttribute(fCol, 3));
      flowGlowGeo.setAttribute("position", new THREE.Float32BufferAttribute(fPos, 3));
      flowGlowGeo.setAttribute("color", new THREE.Float32BufferAttribute(fCol, 3));
      nodeGeo.setAttribute("position", new THREE.Float32BufferAttribute(nPos, 3));
      glowGeo.setAttribute("position", new THREE.Float32BufferAttribute(gPos, 3));

      const shimmer = .88 + Math.sin(breathing * 2.7) * .12;
      wireMat.opacity = (.20 + wireReveal * .95) * shimmer;
      faintWireMat.opacity = .18 + wireReveal * .56;
      haloMat.opacity = wireReveal * (.10 + lock * .30) * shimmer;
      flowMat.opacity = .88 * Math.pow(1 - lock, 1.55);
      flowGlowMat.opacity = .46 * Math.pow(1 - lock, 1.35) * shimmer;
      nodeMat.opacity = 0;
      glowMat.opacity = 0;

      renderer.render(scene, camera);
      requestAnimationFrame(update);
    }

    function resize() {
      const w = innerWidth;
      const h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.position.z = w < 760 ? 1020 : 880;
      camera.updateProjectionMatrix();
    }

    addEventListener("resize", resize, { passive: true });
    resize();
    update();
  </script>
</body>
</html>
